            - paragraph [ref=e58]: "You’re not new to the fitness neighborhood, but you aren’t sure if you need a program like GymFit. Here are a few reasons you should be here:"
            - list [ref=e59]:
              - listitem [ref=e60]: You need a competitive edge in your sport.
              - listitem [ref=e61]: The gym is starting to bore you, and you want some fun hard work—like handstands or gymnastic rings.
              - listitem [ref=e62]: You think you can’t do your favorite sport anymore because you’re “too old.”
              - listitem [ref=e63]: You’re consistent and committed, but you keep hitting plateaus.
              - listitem [ref=e64]: You keep getting injured.
              - listitem [ref=e65]: You would like to get stronger than you ever thought was possible while still being able to move like a panther.
            - paragraph [ref=e66]: Our program addresses all of the above. It doesn’t merely strengthen your muscles, it builds your body. It’s for every athlete. It’s systematic. And it works if you’re consistent and committed.
            - heading "FOUNDATION SERIES" [level=1] [ref=e67]
          - paragraph [ref=e69]: If you are in decent shape already, you will start with our Foundation Series, which covers seven disciplines of movement and prepares your body holistically for advanced physical endeavors. This goes up to elite level, so it can get challenging if you need that. But it starts at healthy beginner, if you need that. Let’s take a closer look at Foundation tracks, so you understand where you are going when you work your way through Foundation Courses.
