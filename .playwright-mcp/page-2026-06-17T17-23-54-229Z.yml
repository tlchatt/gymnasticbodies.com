    - main [ref=e18]:
      - heading "Why Bodyweight?" [level=1] [ref=e26]
      - link "Get Started" [ref=e28] [cursor=pointer]:
        - /url: /subscribe
      - generic [ref=e30]:
        - paragraph [ref=e31]: Maybe you’re not convinced that it’s possible to get huge results only using bodyweight. But if you’ve been looking for sustainable fitness that doesn’t skimp on gains, you’ve come to the right place. Let us explain why the bodyweight movement is such a big deal and why GymFit specifically can guide you into your greatest fitness.
        - heading "Bodyweight provides more resistence than is commonly understood." [level=1] [ref=e32]
      - generic [ref=e33]:
        - paragraph [ref=e34]: If you’ve been looking at bodyweight programs that max out at squats and push-ups, we understand the confusion.
        - list [ref=e35]:
          - listitem [ref=e36]: Two-dimensional movements like squats and push-ups eventually plateau if no resistance (weight) is added.
          - listitem [ref=e37]: Your entire bodyweight becomes resistence as soon as your angles change.
          - listitem [ref=e38]: This kind of resistance calls for full-body engagement, rather than one targeted muscle at a time.
  - generic [ref=e40]:
    - heading "It’s safe and scalable to you" [level=1] [ref=e42]
    - generic [ref=e43]:
      - paragraph [ref=e44]: Many intense and effective workout regimes run a high risk of injury. With bodyweight, you can gain the intensity without feeling so vulnerable.
      - list [ref=e45]:
        - listitem [ref=e46]: You easily adjust your difficulty when you are ready.
        - listitem [ref=e47]: Our program coaches you on proper form and individual muscle-strengthening.
        - listitem [ref=e48]: Your workouts consist of the most potent and practical movements at each level
  - generic [ref=e50]:
    - heading "You’ll build an insane core" [level=1] [ref=e52]
    - generic [ref=e53]:
      - paragraph [ref=e54]: An athlete doesn’t just want pretty abs. They need core strength that moves and stabilizes the body.
      - list [ref=e55]:
        - listitem [ref=e56]: We strengthen your entire trunk arear 360-degrees (Abs, Obliques, Lower Back, etc.)
        - listitem [ref=e57]: The core is at the foundation of everything we do, so it’s trained even in non-core specific workouts.
        - listitem [ref=e58]: Our core-specific workouts are designed to progress your core stamina as well as strength.
  - generic [ref=e60]:
    - heading "You build stability with fluid movements" [level=1] [ref=e62]
    - generic [ref=e63]:
      - paragraph [ref=e64]: Very rarely do we move at strict ninety-degree angles. Your body needs to be under control while moving.
      - list [ref=e65]:
        - listitem [ref=e66]: Healthy movement requires healthy multi-dimensional joints.
        - listitem [ref=e67]: Because our athletes train active mobility, they are ahead of the curve in joint strength and injury prevention.
        - listitem [ref=e68]: As you progress, you can add weights to your active mobility routines, but you will master your own bodyweight first.
  - generic [ref=e70]:
    - heading "It’s convenient and effective" [level=1] [ref=e72]
    - generic [ref=e73]:
      - paragraph [ref=e74]: If you have a bit of floor space and maybe a bare wall, you’ve got yourself a gym.
      - list [ref=e75]:
        - listitem [ref=e76]: Bodyweight exercises can be done almost anywhere.
        - listitem [ref=e77]: We require minimal, if any, equipment.
        - listitem [ref=e78]: Workouts can be short and intense, mixing cardio and strength similar to HIIT.
        - listitem [ref=e79]: Quick and effective workouts to give you more time in your day
  - generic [ref=e81]:
