        - heading "Correcting Weaknesses" [level=4] [ref=e27]
        - generic [ref=e28]:
          - paragraph [ref=e29]: Last year, I was 51 years old and I decided that I wanted to learn a handstand. That’s how I found GymnasticBodies. Until this point, I never thought that I would want to do any gymnastic movements. The Handstand course was excellent. I am an athlete and a performance coach so I could really appreciate the depth of the program and the knowledge put into it.
          - paragraph [ref=e30]: In the beginning of my training, I was very humbled. I thought that I was a pretty good athlete, but the programs quickly revealed many of my weaknesses. At first, I was “in a hurry” to quickly learn a handstand, but then I realized that this is going to be a long journey. I surrendered and started to train with the mindset that this is a lifestyle, where I am correcting all weaknesses and making the body strong from all angles—working on strength and mobility at the same time. The coaches are amazing and extremely helpful. It’s almost like going to school on how to become a super human. Sometimes the progress seems very slow, but looking back, it has been a solid, continuous progress. I am not in a hurry anymore, this is the way to live.