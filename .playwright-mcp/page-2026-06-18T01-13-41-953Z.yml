              - heading "Complete Athletic Blueprint" [level=2] [ref=e133]
              - paragraph [ref=e134]: You don’t need a degree in physiotherapy to make this work. We’ll supply a detailed plan of bodyweight strength and mobility workouts, perfect for short- and long-term goals. You just show up and give your personal best.
              - paragraph [ref=e135]: All our programs form a complete athletic blueprint. You can start as an absolute beginner built like a concrete zombie and over time develop into a strong and flexible athlete. We’ll be with you every step.
