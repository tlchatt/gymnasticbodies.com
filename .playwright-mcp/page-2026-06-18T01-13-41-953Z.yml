            - generic [ref=e124]:
              - heading "Workout History & Support" [level=2] [ref=e125]
              - paragraph [ref=e126]: Training is a journey and improvement comes in small steps. We make it easy for you to see progress over time so that any workout you do can be logged and tracked. Where will you be in a month? In a year?
              - paragraph [ref=e127]: Your success is our main priority. Our support team consists of advanced coaches who have been through the sticking points you may have, and they can offer advice on what to do next.
              - paragraph [ref=e128]:
                - text: Not sure where to start? Just ask, we’re an
