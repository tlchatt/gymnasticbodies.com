            - heading "BUILD A STRONG, FLEXIBLE, POWERFUL BODY." [level=2] [ref=e43]
            - paragraph
            - paragraph [ref=e44]: We believe exercise can be fun, informative, and life-changing. With access to our entire library, you can rebuild and strengthen your body from every angle. Begin with basic movements and joint strengthening. Advance into the mechanics of movement, preparing your body for anything you throw at it. Our programming takes athletes past old plateaus and graduates them into strength they didn’t know they were missing.
            - paragraph [ref=e45]: Time for you to get strong, limber, and build skills you thought were impossible.
        - heading "What’s Included:" [level=3] [ref=e47]
        - generic [ref=e48]:
          - generic [ref=e50]:
            - generic [ref=e51]:
              - heading "Strength" [level=2] [ref=e52]
              - paragraph [ref=e53]: Our approach to strength-building is nuanced because the roadmap to strength is unique to every individual. Beginners are encouraged to use less resistance and more reps, while advanced athletes will have to work against extreme load using their bodyweight at challenging angles.
            - img "All Access 6" [ref=e56]
            - paragraph [ref=e58]: Our system will coach you on where to begin and what kinds of work to schedule through your weekly workouts. An athlete who sticks with the program will get stronger if they are consistent and go at a reasonable pace.
          - generic [ref=e60]:
            - generic [ref=e61]:
              - heading "Mobility" [level=2] [ref=e62]
              - paragraph [ref=e63]: We want to make sure you have healthy, mobile joints that can support your strength work. When you have access to our entire library, you have access to a system that can potentially rebuild you from every angle.
            - img "All Access 8" [ref=e66]
            - paragraph [ref=e68]: The Stretch Series will prep your movement by expanding your passive reach. You will also build strength into your mobility in each step of our programming. Active mobility is included in focused sequences as well as interspersed through your Levels and Foundation sequences.
          - generic [ref=e70]:
            - generic [ref=e71]:
              - heading "Nutrition" [level=2] [ref=e72]
              - paragraph [ref=e73]: "Nutrition is one key to a balanced, healthy body and therefore included in our programming. We approach nutrition with the same discipline with which we approach working out: Ease in and be consistent. Thrive Nutrition will teach you how to eat well so you can perform well in your workouts and in your life."
            - img "All Access 10" [ref=e76]
          - generic [ref=e78]:
            - generic [ref=e79]:
              - heading "Integrated Plans" [level=2] [ref=e80]
              - paragraph [ref=e81]: No matter your level of physical fitness, we have a plan laid out for your success. Haven’t worked out in a while? No problem. We can ease you into the Intro Plan or Level One Plan (depending on your mobility). Are you strong and mobile, but can’t get past that plateau? Maybe Level Two is your schtick. Use our quick assessment tool to determine which plan fits you, and your week will automatically populate with exercises we think will advance your body to its awesomest. Then you can adjust it as much as you want for following weeks!
            - img "All Access 11" [ref=e84]
          - generic [ref=e86]:
            - generic [ref=e87]:
              - heading "Restoration" [level=2] [ref=e88]
              - paragraph [ref=e89]: If you’re coming in with pains and imbalances, we can help. Our Intro Plan has been designed especially for those who have some ground to make up before they can make real gains. Fundamentals will help you discover basic mobility through natural movements. Restore will give you specific routines to loosen specific joints. Bands will strengthen your joints through extended ranges of motion with gentle load.
            - img "All Access 13" [ref=e92]
          - generic [ref=e94]:
            - generic [ref=e95]:
              - heading "Skills" [level=2] [ref=e96]
              - paragraph [ref=e97]: One of the benefits of developing strength and mobility is being able to then do cool things. The stronger and more mobile an athlete becomes, the more they can partake in fun things that make working out out a blast.
            - img "All Access 15" [ref=e100]
          - generic [ref=e102]:
            - generic [ref=e103]:
              - heading "Much More!" [level=2] [ref=e104]
              - paragraph [ref=e105]: It’s... a lot. We’re constantly adding to our library of workouts, which means you get tons of additional core, mobility, strength, flexibility, and prehab options. But we’ve provided a way for you to sort through the library, as well as keeping track of your workouts daily. A lot of time has gone into getting you to a point where you can be successful.
            - img "All Access 17" [ref=e108]
          - generic [ref=e109]:
            - link "program selector" [ref=e111] [cursor=pointer]:
