      - heading "Frequently Asked Questions" [level=3] [ref=e145]
      - list [ref=e148]:
        - listitem [ref=e149]:
          - generic [ref=e150]:
            - text: Is bodyweight training effective for building muscle?
            - text: There are two different types of muscle that you can put on. Bodyweight training is most effective at building muscle density. Think incredibly strong but lean like a gymnast. Muscle size is more common in bodybuilding but can also be done with special programming of bodyweight training.
        - listitem [ref=e151]:
          - generic [ref=e152]:
            - text: Is bodyweight training enough?
            - text: Bodyweight training is so effective that weight training is not required at all. Some students choose to supplement their weight training with bodyweight work while others do not weight train at all. It comes down to your goals and having a good program like GymFit to progress you properly.
        - listitem [ref=e153]:
          - generic [ref=e154]:
            - text: Why are bodyweight exercise as effective as weight training?
            - text: The short answer is that the body doesn’t care whether your resistance comes from a weight or creating load through bodyweight progressions. Bodyweight workouts focus on maximal muscle contraction which makes the muscle more efficient and thus stronger.
        - listitem [ref=e155]:
          - generic [ref=e156]:
            - text: Can you build muscle without a gym?
            - text: Absolutely. Many students workout at home with minimal equipment or at playgrounds or parks. Some skills and exercises do require equipment to learn, but for most everything the best piece of equipment is your own body!
        - listitem [ref=e157]:
          - generic [ref=e158]:
            - text: Can you maintain muscle with bodyweight exercises?
            - text: Yes, though it depends on whether your mobility is in line with your strength. If you are too tight while being very strong, you are very likely to get injured. In this scenario, we put muscle gains on maintenance while building the proper mobility. The benefit of good mobility is that you’ll be able to use the muscle in larger ranges of motion and so will be even stronger long term.
