        - generic [ref=e30]:
          - generic [ref=e31]:
            - paragraph [ref=e32]: We’re not rigid about what constitutes a “beginner.” You may be new to fitness or you may simply be new to GymFit and our methodology. Either way, we help athletes like you discover their deficits and gently address them before moving into greater fitness gains. Likewise, if you’ve been struggling with injuries and know you need to strengthen tendons and regain mobility, the Intro Plan is a gateway into new levels of freedom.
            - paragraph [ref=e33]: "This is how it works:"
            - heading "#1-Recover Basic Mobility with Fundamentals" [level=1] [ref=e34]
          - generic [ref=e35]:
            - generic [ref=e36]:
              - img "Fundamentals" [ref=e37]
              - paragraph [ref=e38]: Fundamentals is our introductory course, which has active movements you haven’t practiced since you were a kid in gym class. The goal is to get your body back to a baseline fitness.
              - paragraph [ref=e39]: You will be surprised by how much mobility you might be lacking in these simple movements. It’s normal. Adults don’t often crawl across the floor like a bear or a lizard. But there is method in our madness. These movements unlock joints and gently reintroduce mobility with your own bodyweight as load.
              - paragraph [ref=e40]: It may take a few months to do these well, but it will be worth it when you feel youthful again.
            - generic [ref=e41]:
              - img "Fundamentals" [ref=e42]
              - img "Fundamentals" [ref=e43]
          - link "Get Started" [ref=e45] [cursor=pointer]:
            - /url: https://www.gymnasticbodies.com/all-access/
          - heading "#2-Target and Repair Deficits with Restore and Bands" [level=1] [ref=e47]
          - img "Hey Newbies 6" [ref=e49]
          - img "Hey Newbies 7" [ref=e51]
          - generic [ref=e52]:
            - paragraph [ref=e53]: Once you know your weak mobility points, you can focus more specifically on stretching and strengthening those tight, painful areas. We already schedule the Restore Series and the Band Series throughout the Intro program, but we suggest repeating the stretches and exercises that you need most. For example, if you can’t quite reach the ground in stiff bear due to tight hamstrings, then we recommend adjusting your workout schedule to include Hamstring Restore on a regular basis.
            - img "Fundamentals" [ref=e54]
            - img "Fundamentals" [ref=e55]
            - paragraph [ref=e56]: Ultimately, the goal is always to get you to that next level of strength and mobility. Once you’ve spent the months remobilizing, you can jump into our Level programs more earnestly. There’s no hurry. Slow, steady, and consistent is how you move beyond deficits and get your body back.
